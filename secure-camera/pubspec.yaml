name: secure_camera
description: TrustChain Secure Evidence Camera Mobile Client (iOS & Android)

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  camera: ^0.10.5+9
  geolocator: ^10.1.0
  crypto: ^3.0.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  path: ^1.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
